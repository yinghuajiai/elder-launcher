name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK (Android 6~10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5          # 日志建议 v5，消除 deprecation
        with:
          distribution: temurin
          java-version: '17'

      # 安装 Gradle 8.5 到 PATH（仓库有 wrapper 时用 wrapper，没有时用 gradle 命令）
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --stacktrace
          else
            echo "⚠️ gradlew 缺失，使用 Gradle 8.5 构建（建议本地执行: gradle wrapper --gradle-version 8.5）"
            gradle :app:assembleDebug --stacktrace
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build Release APK
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease
          else
            gradle :app:assembleRelease
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk