plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.elder.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.elder.launcher"
        minSdk 23
        targetSdk 29     // Android 10 —— 包可见性/分区存储分水岭
        versionCode 1
        versionName "0.1.0"
    }

    // ★ 固定签名：debug/release 共用同一把密钥（testkey.p12，PKCS12 格式），
    //   避免每次换环境导致「签名不一致、需卸载重装」。
    signingConfigs {
        release {
            storeFile file("keystore/testkey.p12")
            storeType "PKCS12"
            storePassword "android"
            keyAlias "mt"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // ★ 本应用只面向 Android 6~10、非 Google Play 渠道，
    //   关闭 Play 政策强制类 lint（targetSdk 33+ 检查）
    lint {
    abortOnError false
    disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
}
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.belerweb:pinyin4j:2.5.1'

    // 视频播放：Media3 (ExoPlayer) —— 仅取播放逻辑，外观保持简洁
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}